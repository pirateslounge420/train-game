// ---- materials: brass and iron with a painted grain, cloth with a weave, energy that glows ----
function makeMaterials(THREE,skin){
  const A=new THREE.Color(skin.accent), Ad=A.clone().multiplyScalar(0.36);
  const grain=grainTexture(THREE,'metal'), weave=grainTexture(THREE,'cloth'), leather=grainTexture(THREE,'leather');
  const metal=(c,shine,spec)=>new THREE.MeshPhongMaterial({color:c,map:grain,shininess:shine,specular:spec});
  const cloth=(c,map)=>new THREE.MeshLambertMaterial({color:c,map:map||weave});
  const M={};
  M.plate=metal(skin.plate,55,0x66573a); M.plate2=metal(skin.plate2,40,0x4a4030); M.under=metal(skin.under,18,0x222228);
  M.chrome=new THREE.MeshPhongMaterial({color:skin.chrome,shininess:120,specular:0xd0d0d8});
  M.hat=cloth(skin.hat,leather); M.hat.side=THREE.DoubleSide; M.bandana=cloth(skin.bandana); M.coat=cloth(skin.coat); M.glove=cloth(skin.glove,leather); M.boot=cloth(skin.boot,leather); M.quiver=cloth(skin.quiver,leather);

  M.glow=new THREE.MeshLambertMaterial({color:Ad.getHex(),emissive:A.getHex(),emissiveIntensity:0.9});   // energy: veins, bands, hubs, bow marks
  M.eye=new THREE.MeshBasicMaterial({color:skin.eye});                  // horse eye, goggle lenses, forehead lens: unlit, always bright
  M.bow=skin.bow==='compound'?metal(skin.bowColor,70,0x77653a):new THREE.MeshLambertMaterial({color:skin.bowColor,emissive:Ad.getHex()});
  M.shaft=cloth(0xcdbf9a); M.fletch=cloth(parseInt(skin.poncho.mark.slice(1),16)); M.string=new THREE.MeshBasicMaterial({color:0xe8e2cf});
  M.void=new THREE.MeshLambertMaterial({color:0x07060c});
  M.poncho=cloth(0xffffff,ponchoTexture(THREE,skin.poncho,2)); M.poncho.side=THREE.DoubleSide;
  M.band=skin.band==='poncho'?cloth(0xffffff,ponchoTexture(THREE,skin.poncho,6)):cloth(skin.band);

// a grey grain, tinted by each material's colour: brushed metal with panel scratches, a cloth weave, a leather pebble
const _texCache={};
function grainTexture(THREE,kind){

  g.fillStyle='#d6d6d6'; g.fillRect(0,0,128,128);
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  if(kind==='metal'){ for(let i=0;i<900;i++){ const v=170+Math.floor(rnd()*70); g.fillStyle='rgb('+v+','+v+','+v+')'; g.fillRect(rnd()*128,rnd()*128,1+rnd()*14,1); }
    g.fillStyle='rgba(60,50,40,0.35)'; for(let i=0;i<10;i++){ g.fillRect(rnd()*128,rnd()*128,rnd()*40,1); }

  else if(kind==='cloth'){ for(let y=0;y<128;y+=2) for(let x=0;x<128;x+=2){ const v=200+Math.floor(rnd()*40)-((x+y)%4?0:18); g.fillStyle='rgb('+v+','+v+','+v+')'; g.fillRect(x,y,2,2); } }

  return _texCache[kind]=t;
}
// a soft radial disc for the light that blooms off eyes, lenses and hubs
function glowSprite(THREE){
  if(_texCache.spr) return _texCache.spr;
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,255,255,0.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');

// the poncho cloth, drawn once on a canvas: chevrons or lightning bolts, with a weave over it
function ponchoTexture(THREE,p,repeat){
  const c=document.createElement('canvas'); c.width=128; c.height=128; const g=c.getContext('2d');
  g.fillStyle=p.base; g.fillRect(0,0,128,128); g.fillStyle=p.mark;
  if(p.pattern==='chevron'){ const amp=10, step=16;
    for(let r=0;r<4;r++){ const y0=r*32+6; g.beginPath(); g.moveTo(0,y0);
      for(let x=0;x<=128;x+=step){ g.lineTo(x+step/2,y0+amp); g.lineTo(x+step,y0); }
      g.lineTo(128,y0+10); for(let x=128;x>=0;x-=step){ g.lineTo(x-step/2,y0+amp+10); g.lineTo(x-step,y0+10); }
      g.closePath(); g.fill(); }
  } else { // bolts: a zigzag ribbon, four columns, staggered
    for(let col=0;col<4;col++){ const x0=col*32+8+(col%2)*6, y0=(col%2)*16;
      const pts=[[0,0],[10,0],[4,18],[12,18],[-2,44],[2,26],[-6,26]];
      for(const yy of [y0-64,y0,y0+64]){ g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x0+x,yy+y):g.moveTo(x0+x,yy+y)); g.closePath(); g.fill(); } }
  }
  let seed=3; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let y=0;y<128;y+=2) for(let x=0;x<128;x+=2){ if((x+y)%4===0||rnd()<0.08){ g.fillStyle='rgba(0,0,0,'+(0.06+rnd()*0.08)+')'; g.fillRect(x,y,2,2); } }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat);
  t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearMipmapLinearFilter; t.anisotropy=4; if(THREE.sRGBEncoding) t.encoding=THREE.sRGBEncoding;
  return t;
}
// a plate is a chamfered box: the edges catch the light. Extruded along its thinnest axis so every long edge is bevelled.
const _geoCache={};
function plateGeo(THREE,w,h,d,c){
  const key=[w,h,d,c].join(','); if(_geoCache[key]) return _geoCache[key];
  const mn=Math.min(w,h,d); c=Math.min(c,mn*0.4);
  let a,b,depth,rot; if(mn===d){ a=w;b=h;depth=d;rot=null; } else if(mn===w){ a=d;b=h;depth=w;rot='y'; } else { a=w;b=d;depth=h;rot='x'; }
  const sh=new THREE.Shape(); const ax=a/2-c, by=b/2-c; sh.moveTo(-ax,-by); sh.lineTo(ax,-by); sh.lineTo(ax,by); sh.lineTo(-ax,by); sh.lineTo(-ax,-by);
  const g=new THREE.ExtrudeGeometry(sh,{depth:depth-2*c,bevelEnabled:true,bevelThickness:c,bevelSize:c,bevelSegments:2,steps:1,curveSegments:1});
  g.translate(0,0,-(depth-2*c)/2); if(rot==='y') g.rotateY(PI/2); else if(rot==='x') g.rotateX(PI/2);
  g.computeVertexNormals();
  return _geoCache[key]=g;
}

const camera=new THREE.PerspectiveCamera(38,1,0.1,200);
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x7a5410,0.5));
const sun=new THREE.DirectionalLight(0xfff0d2,1.1); sun.position.set(4,7,3); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.near=1; sun.shadow.camera.far=30; sun.shadow.camera.left=sun.shadow.camera.bottom=-4; sun.shadow.camera.right=sun.shadow.camera.top=4; sun.shadow.bias=-0.0008; sun.shadow.normalBias=0.02; scene.add(sun);
const fill=new THREE.DirectionalLight(0x9fc4ff,0.35); fill.position.set(-5,3,-2); scene.add(fill);
const rim=new THREE.DirectionalLight(0xffe2a8,0.6); rim.position.set(-2,4,-6); scene.add(rim);
// the ground of the frame: flat gold, a few rocks, a cactus
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,40),new THREE.MeshLambertMaterial({color:new THREE.Color(0xe9a62a).convertSRGBToLinear()})); ground.rotation.x=-PI/2; ground.receiveShadow=true; scene.add(ground);
const rockM=new THREE.MeshLambertMaterial({color:new THREE.Color(0xc27a2a).convertSRGBToLinear()});
for(let i=0;i<9;i++){ const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.12,0.3),0),rockM); const a=rand(0,PI*2), d=rand(2.2,6); r.position.set(Math.cos(a)*d,0.08,Math.sin(a)*d); r.rotation.set(rand(0,3),rand(0,3),0); r.castShadow=true; scene.add(r); }
const cacM=new THREE.MeshLambertMaterial({color:new THREE.Color(0x5fbf4a).convertSRGBToLinear()});
const cac=new THREE.Group(); cac.position.set(3.6,0,-2.4); scene.add(cac);
for(const [x,y,h] of [[0,0.9,1.8],[-0.32,1.0,0.7],[0.32,1.2,0.6]]){ const m=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,h,8),cacM); m.position.set(x,y,0); m.castShadow=true; cac.add(m); }
for(const x of [-0.32,0.32]){ const m=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.4,8),cacM); m.rotation.z=PI/2; m.position.set(x/2,0.8+(x>0?0.3:0),0); cac.add(m); }

let skin='goldLightning'; let rider=MachineRiders.build(THREE,{skin,srgb:true,outline:true}); scene.add(rider.root);
for(const [id,k] of [['sGold','goldLightning'],['sViolet','violetChevron']]) document.getElementById(id).addEventListener('click',()=>{ skin=k; document.getElementById('sGold').classList.toggle('on',k==='goldLightning'); document.getElementById('sViolet').classList.toggle('on',k==='violetChevron'); document.getElementById('bReset').click(); });
const hitGroup=new THREE.Group(); scene.add(hitGroup); let showHit=false;
const hitMat=new THREE.MeshBasicMaterial({color:0xb48cff,wireframe:true});
function rebuildHit(){ while(hitGroup.children.length) hitGroup.remove(hitGroup.children[0]); if(!showHit) return;
  for(const k in rider.parts){ const p=rider.parts[k]; if(!p.on) continue; for(const b of p.def.hit){ const m=new THREE.Mesh(new THREE.BoxGeometry(b[0],b[1],b[2]),hitMat); m.position.set(b[3],b[4],b[5]); p.g.add(m); m.userData.hit=true; } } }
function clearHit(){ for(const k in rider.parts){ const g=rider.parts[k].g; for(let i=g.children.length-1;i>=0;i--) if(g.children[i].userData.hit) g.remove(g.children[i]); } }

// orbit: drag / wheel / pinch, turntable until you touch it
let yaw=0.75, pitch=0.2, dist=6.4, auto=true, drag=null, pinch=null;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,id:e.pointerId}; auto=false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; yaw-=(e.clientX-drag.x)*0.008; pitch=Math.max(-0.3,Math.min(1.2,pitch+(e.clientY-drag.y)*0.006)); drag.x=e.clientX; drag.y=e.clientY; });
cv.addEventListener('pointerup',()=>drag=null); cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{ dist=Math.max(2.2,Math.min(12,dist*(1+Math.sign(e.deltaY)*0.08))); e.preventDefault(); },{passive:false});
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); drag=null; } },{passive:true});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); dist=Math.max(2.2,Math.min(12,dist*pinch/d)); pinch=d; } },{passive:true});
cv.addEventListener('touchend',()=>pinch=null);

// gait and gore preview
let speed=12, phase=0; const ragdolls=[];
const bs={Stand:0,Walk:2.5,Gallop:12};
for(const k in bs){ document.getElementById('b'+k).addEventListener('click',()=>{ speed=bs[k]; for(const j in bs) document.getElementById('b'+j).classList.toggle('on',j===k); }); }
document.getElementById('bHit').addEventListener('click',e=>{ showHit=!showHit; e.target.classList.toggle('on',showHit); clearHit(); rebuildHit(); });
document.getElementById('bPop').addEventListener('click',()=>{ const live=Object.values(rider.parts).filter(p=>p.on&&p.def.n!=='barrel'); if(!live.length) return; const part=live[Math.floor(Math.random()*live.length)];
  part.on=false; for(const k in rider.parts){ const q=rider.parts[k]; let d=q.def; while(d.p&&rider.parts[d.p]){ if(d.p===part.name){ q.on=false; break; } d=rider.parts[d.p].def; } }
  scene.attach(part.g); const v=new THREE.Vector3(rand(-2,2),rand(3,5),rand(-2,2)); const sp=Math.min(3,40/part.def.mass)*4;
  ragdolls.push({obj:part.g,vel:v,ang:new THREE.Vector3(rand(-sp,sp),rand(-sp,sp)*0.4,rand(-sp,sp)),lie:Math.max(0.08,part.def.r*0.6)});
  // sparks from the stump: the machine bleeds light
  for(let i=0;i<10;i++){ const s=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05),new THREE.MeshBasicMaterial({color:rider.skin.eye})); part.g.getWorldPosition(s.position); scene.add(s); ragdolls.push({obj:s,vel:new THREE.Vector3(rand(-3,3),rand(1,5),rand(-3,3)),ang:new THREE.Vector3(9,9,9),lie:0.02,life:1.2}); }
  clearHit(); rebuildHit(); });
document.getElementById('bReset').addEventListener('click',()=>{ scene.remove(rider.root); for(const g of ragdolls) scene.remove(g.obj); ragdolls.length=0; rider=MachineRiders.build(THREE,{skin,srgb:true,outline:true}); scene.add(rider.root); clearHit(); rebuildHit(); });

function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
let last=performance.now();
function frame(now){ requestAnimationFrame(frame); let dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;
  if(auto) yaw+=dt*0.25;
  phase+=dt*speed/2.4; rider.animate(phase,speed,dt,t);
  for(let i=ragdolls.length-1;i>=0;i--){ const g=ragdolls[i], o=g.obj; g.vel.y-=12*dt; o.position.addScaledVector(g.vel,dt); o.rotation.x+=g.ang.x*dt; o.rotation.z+=g.ang.z*dt;
    if(o.position.y<g.lie){ o.position.y=g.lie; if(g.vel.y<-1.2){ g.vel.y*=-0.45; g.vel.x*=0.7; g.vel.z*=0.7; g.ang.multiplyScalar(0.6); } else { g.vel.set(0,0,0); g.ang.set(0,0,0); } }
    if(g.life!==undefined){ g.life-=dt; if(g.life<=0){ scene.remove(o); ragdolls.splice(i,1); } } }
  const cy=window.__cy||1.5; camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist, cy+Math.sin(pitch)*dist, Math.cos(yaw)*Math.cos(pitch)*dist); camera.lookAt(0,cy,0);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
